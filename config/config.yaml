tickers: ['AAPL', 'AMZN', 'GOOG', 'META', "NFLX"]
stock_data_path: "./data/"
max_total_iterations: 100
max_iterations: 1000
max_total_runtime: 300
max_runtime: 60
risk_free_rate: 0.02
min_weight: 0.01
metric: 'sharpe_ratio' # 'sharpe_ratio', 'sortino_ratio', 'max_drawdown', 'annualized_return', 'annualized_volatility'

Simulated_Annealing:
  initial_temperature: 100
  cooling_rate: 0.003
  stopping_temperature: 0.0001
  inertia: 0.7
  cognitive: 1.5
  social: 1.5
  schedule: 'linear' # 'linear', 'geometric', 'lundy_mees'

  max_rejections: 250
  max_acceptances: 15
  max_plateau_rejections: 50
  max_plateau_acceptances: 10
  max_total_rejections: 1000
  max_total_acceptances: 100
  max_plateau_total_rejections: 500
  max_plateau_total_acceptances: 50
  max_plateau_iterations: 100
  max_plateau_runtime: 10

Particle_Swarm_Optimization:
  num_particles: 10

Genetic_Algorithm:
  population_size: 10
  mutation_rate: 0.1

Ant_Colony_Optimization:
  num_ants: 10

Markowitz_Model:
